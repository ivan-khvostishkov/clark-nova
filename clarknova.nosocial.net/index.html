<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Clark Nova — Royal Quiet De Luxe Typewriter</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #1a1a1a; font-family: monospace;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
#app {
  width: 100%; height: 100%; display: flex; flex-direction: column;
}
#canvas-area {
  flex: 1; overflow: hidden; display: flex; flex-direction: column;
  align-items: center; background: #2a2a2a; position: relative;
}
</style>
</head>
<body>
<div id="app">
  <div id="canvas-area"></div>
  <div id="nameplate"><span>Clark Nova</span></div>
  <div id="keyboard-area"></div>
</div>
<script>
(function() {
'use strict';

// === CONSTANTS ===
const CELL_W = 31;
const CELL_H = 44;
const COLS = 80;
const ROWS = 79;
const CANVAS_W = 2480;
const CANVAS_H = 3508;
const LEFT_MARGIN = 10;
const RIGHT_MARGIN = 70;
const HARD_RIGHT = 80;
const BELL_COL = 63;
const RULER_H = 24;
const PAPER_PAD = 30; // gray padding above/below paper

// === STATE ===
let cursorCol = LEFT_MARGIN;
let cursorRow = 1;
let shiftLocked = false;
let shiftHeld = false;
let marginReleased = false;
let audioCtx = null;

// === DOM SETUP ===
const canvasArea = document.getElementById('canvas-area');

// Build structure: ruler-top, viewport(paper+cursor), ruler-bottom
const rulerTopCanvas = document.createElement('canvas');
const rulerBottomCanvas = document.createElement('canvas');
const viewport = document.createElement('div');
viewport.id = 'paper-viewport';
const paperWrap = document.createElement('div');
paperWrap.id = 'paper-wrap';
const topPad = document.createElement('div');
topPad.className = 'paper-pad';
const bottomPad = document.createElement('div');
bottomPad.className = 'paper-pad';
const paperContainer = document.createElement('div');
paperContainer.id = 'paper-container';
const canvas = document.createElement('canvas');
canvas.id = 'typing-canvas';
canvas.width = CANVAS_W;
canvas.height = CANVAS_H;
const cursorEl = document.createElement('div');
cursorEl.id = 'cursor';

paperContainer.appendChild(canvas);
paperContainer.appendChild(cursorEl);
paperWrap.appendChild(topPad);
paperWrap.appendChild(paperContainer);
paperWrap.appendChild(bottomPad);
viewport.appendChild(paperWrap);
canvasArea.appendChild(rulerTopCanvas);
canvasArea.appendChild(viewport);
canvasArea.appendChild(rulerBottomCanvas);

const ctx = canvas.getContext('2d');
// === CANVAS INIT (white background + watermarks) ===
function initCanvas() {
  // White background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  // Steganographic watermarks in 4 A6 quadrant centers
  // A6 = half A5 = quarter A4, so quadrants are 1240x1754 each
  // Centers at (620,877), (1860,877), (620,2631), (1860,2631)
  const watermarkPositions = [
    [620, 877], [1860, 877], [620, 2631], [1860, 2631]
  ];
  ctx.font = 'bold 48px "Courier New", Courier, monospace';
  ctx.fillStyle = 'rgba(254,254,254,1)'; // nearly white, invisible to eye
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  watermarkPositions.forEach(([x, y]) => {
    ctx.fillText('Clark Nova', x, y);
  });
  ctx.textAlign = 'start';
  ctx.textBaseline = 'top';
}
initCanvas();

// === AUDIO ===
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playKeystroke() {
  try {
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(800 + Math.random() * 400, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, ac.currentTime + 0.03);
    gain.gain.setValueAtTime(0.3, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.05);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(ac.currentTime); osc.stop(ac.currentTime + 0.05);
  } catch(e) {}
}
function playBell() {
  try {
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(2000, ac.currentTime);
    gain.gain.setValueAtTime(0.4, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.5);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(ac.currentTime); osc.stop(ac.currentTime + 0.5);
  } catch(e) {}
}
// === CHARACTER MAP (Royal Quiet De Luxe) ===
const keyRows = [
  [{lower:'1',upper:'!',code:'Digit1'},{lower:'2',upper:'"',code:'Digit2'},
   {lower:'3',upper:'#',code:'Digit3'},{lower:'4',upper:'$',code:'Digit4'},
   {lower:'5',upper:'%',code:'Digit5'},{lower:'6',upper:'_',code:'Digit6'},
   {lower:'7',upper:'&',code:'Digit7'},{lower:'8',upper:"'",code:'Digit8'},
   {lower:'9',upper:'(',code:'Digit9'},{lower:'0',upper:')',code:'Digit0'},
   {lower:'-',upper:'*',code:'Minus'},{lower:'=',upper:'+',code:'Equal'}],
  [{lower:'q',upper:'Q',code:'KeyQ'},{lower:'w',upper:'W',code:'KeyW'},
   {lower:'e',upper:'E',code:'KeyE'},{lower:'r',upper:'R',code:'KeyR'},
   {lower:'t',upper:'T',code:'KeyT'},{lower:'y',upper:'Y',code:'KeyY'},
   {lower:'u',upper:'U',code:'KeyU'},{lower:'i',upper:'I',code:'KeyI'},
   {lower:'o',upper:'O',code:'KeyO'},{lower:'p',upper:'P',code:'KeyP'},
   {lower:'\u00BD',upper:'\u00BC',code:'BracketLeft'}],
  [{lower:'a',upper:'A',code:'KeyA'},{lower:'s',upper:'S',code:'KeyS'},
   {lower:'d',upper:'D',code:'KeyD'},{lower:'f',upper:'F',code:'KeyF'},
   {lower:'g',upper:'G',code:'KeyG'},{lower:'h',upper:'H',code:'KeyH'},
   {lower:'j',upper:'J',code:'KeyJ'},{lower:'k',upper:'K',code:'KeyK'},
   {lower:'l',upper:'L',code:'KeyL'},{lower:';',upper:':',code:'Semicolon'},
   {lower:'\u00A2',upper:'@',code:'Quote'}],
  [{lower:'z',upper:'Z',code:'KeyZ'},{lower:'x',upper:'X',code:'KeyX'},
   {lower:'c',upper:'C',code:'KeyC'},{lower:'v',upper:'V',code:'KeyV'},
   {lower:'b',upper:'B',code:'KeyB'},{lower:'n',upper:'N',code:'KeyN'},
   {lower:'m',upper:'M',code:'KeyM'},{lower:',',upper:',',code:'Comma'},
   {lower:'.',upper:'.',code:'Period'},{lower:'/',upper:'?',code:'Slash'}]
];
const codeToKey = {};
keyRows.forEach(row => row.forEach(k => { codeToKey[k.code] = k; }));

// === CURSOR ===
function updateCursor() {
  cursorEl.style.left = ((cursorCol - 1) * CELL_W) + 'px';
  cursorEl.style.top = ((cursorRow - 1) * CELL_H) + 'px';
  if (cursorCol >= RIGHT_MARGIN && !marginReleased) {
    cursorEl.classList.add('red');
  } else if (cursorCol > HARD_RIGHT) {
    cursorEl.classList.add('red');
  } else {
    cursorEl.classList.remove('red');
  }
  updateMarRelVisual();
  ensureCursorVisible();
}
function ensureCursorVisible() {
  const vpH = viewport.clientHeight;
  const scrollTop = viewport.scrollTop;
  const cursorY = PAPER_PAD + (cursorRow - 1) * CELL_H;
  const cursorBottom = cursorY + CELL_H;
  if (cursorY < scrollTop) {
    viewport.scrollTop = cursorY;
  } else if (cursorBottom > scrollTop + vpH) {
    viewport.scrollTop = cursorBottom - vpH;
  }
}

function updateMarRelVisual() {
  const el = keyElements['MarRel'];
  if (!el) return;
  // MAR REL highlights red when cursor is stuck at margin (not at hard right)
  if (cursorCol >= RIGHT_MARGIN && !marginReleased && cursorCol < HARD_RIGHT) {
    el.classList.add('mar-active');
  } else {
    el.classList.remove('mar-active');
  }
}

// === BELL LOGIC ===
function checkBell(oldCol, newCol) {
  // Bell dings when cursor crosses column 63
  if (oldCol < BELL_COL && newCol >= BELL_COL) {
    playBell();
  }
}

// === TYPING LOGIC ===
function isShifted() { return shiftLocked || shiftHeld; }

function canType() {
  // At position 80, we CAN still print (in place, no advance)
  if (cursorCol > HARD_RIGHT) return false;
  if (cursorCol >= RIGHT_MARGIN && !marginReleased && cursorCol < HARD_RIGHT) return false;
  return true;
}

function typeCharacter(ch) {
  if (!canType()) return;
  const x = (cursorCol - 1) * CELL_W;
  const y = (cursorRow - 1) * CELL_H;
  ctx.font = 'bold 32px "Courier New", Courier, monospace';
  ctx.fillStyle = '#1a1a2e';
  ctx.textBaseline = 'top';
  ctx.fillText(ch, x + 2, y + 6);
  playKeystroke();
  // Position 80: print in place, cursor doesn't advance
  if (cursorCol >= HARD_RIGHT) {
    updateCursor();
    return;
  }
  const oldCol = cursorCol;
  cursorCol++;
  // Margin stop
  if (cursorCol >= RIGHT_MARGIN && !marginReleased) {
    cursorCol = RIGHT_MARGIN;
  }
  checkBell(oldCol, cursorCol);
  updateCursor();
}
function doSpace() {
  if (!canType()) return;
  playKeystroke();
  if (cursorCol >= HARD_RIGHT) {
    // At position 80, space doesn't advance
    updateCursor();
    return;
  }
  const oldCol = cursorCol;
  cursorCol++;
  if (cursorCol >= RIGHT_MARGIN && !marginReleased) {
    cursorCol = RIGHT_MARGIN;
  }
  checkBell(oldCol, cursorCol);
  updateCursor();
}

function doTab() {
  if (!canType()) return;
  playKeystroke();
  const oldCol = cursorCol;
  // Jump to next position divisible by 5
  let target = Math.ceil((cursorCol + 1) / 5) * 5;
  if (target <= cursorCol) target = cursorCol + 5 - (cursorCol % 5);
  if (target > HARD_RIGHT) target = HARD_RIGHT;
  if (target >= RIGHT_MARGIN && !marginReleased) {
    target = RIGHT_MARGIN;
  }
  cursorCol = target;
  checkBell(oldCol, cursorCol);
  updateCursor();
}

function doBackspace() {
  if (cursorCol > 1) {
    cursorCol--;
    updateCursor();
  }
}

function doCarriageReturn() {
  if (cursorRow >= ROWS) return;
  cursorRow++;
  cursorCol = LEFT_MARGIN;
  marginReleased = false;
  updateCursor();
}

function doMarginRelease() {
  // Only works when cursor is stuck at right margin
  if (cursorCol >= RIGHT_MARGIN && !marginReleased && cursorCol < HARD_RIGHT) {
    marginReleased = true;
    // Move cursor one position past margin
    const oldCol = cursorCol;
    cursorCol++;
    if (cursorCol > HARD_RIGHT) cursorCol = HARD_RIGHT;
    checkBell(oldCol, cursorCol);
    updateCursor();
  }
}
// === PHYSICAL KEYBOARD INPUT ===
function handleKeyDown(e) {
  if (e.repeat) return;
  const code = e.code;
  if (code === 'ShiftLeft' || code === 'ShiftRight') {
    shiftHeld = true;
    if (shiftLocked) { shiftLocked = false; updateShiftLockVisual(); }
    highlightKey(code, true);
    e.preventDefault(); return;
  }
  if (code === 'Enter') {
    doCarriageReturn(); highlightKey('Enter', true);
    e.preventDefault(); return;
  }
  if (code === 'Backspace') {
    doBackspace(); highlightKey('Backspace', true);
    e.preventDefault(); return;
  }
  if (code === 'Tab') {
    doTab(); highlightKey('Tab', true);
    e.preventDefault(); return;
  }
  if (code === 'Space') {
    doSpace(); highlightKey('Space', true);
    e.preventDefault(); return;
  }
  const keyDef = codeToKey[code];
  if (keyDef) {
    typeCharacter(isShifted() ? keyDef.upper : keyDef.lower);
    highlightKey(code, true);
    e.preventDefault();
  }
}
function handleKeyUp(e) {
  const code = e.code;
  if (code === 'ShiftLeft' || code === 'ShiftRight') {
    shiftHeld = false; highlightKey(code, false); return;
  }
  highlightKey(code, false);
}
document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);
// === SCHEMATIC KEYBOARD ===
const keyboardArea = document.getElementById('keyboard-area');
const keyElements = {};

function highlightKey(code, on) {
  const el = keyElements[code];
  if (el) { if (on) el.classList.add('pressed'); else el.classList.remove('pressed'); }
}
function updateShiftLockVisual() {
  const el = keyElements['ShiftLock'];
  if (el) { if (shiftLocked) el.classList.add('locked'); else el.classList.remove('locked'); }
}

function buildKeyboard() {
  const kb = document.createElement('div');
  kb.className = 'keyboard';
  // Row 1: BACK SPACE + numbers + TAB
  const row1 = document.createElement('div'); row1.className = 'kb-row';
  row1.appendChild(makeSpecialKey('BACK\nSPACE','Backspace',1.5));
  keyRows[0].forEach(k => row1.appendChild(makeCharKey(k)));
  row1.appendChild(makeSpecialKey('TAB','Tab',1.5));
  kb.appendChild(row1);
  // Row 2
  const row2 = document.createElement('div'); row2.className = 'kb-row';
  keyRows[1].forEach(k => row2.appendChild(makeCharKey(k)));
  kb.appendChild(row2);
  // Row 3: SHIFT LOCK + letters + CR
  const row3 = document.createElement('div'); row3.className = 'kb-row';
  row3.appendChild(makeSpecialKey('SHIFT\nLOCK','ShiftLock',1.8));
  keyRows[2].forEach(k => row3.appendChild(makeCharKey(k)));
  row3.appendChild(makeSpecialKey('\u21B5','Enter',1.8));
  kb.appendChild(row3);
  // Row 4: SHIFT + letters + SHIFT + MAR REL
  const row4 = document.createElement('div'); row4.className = 'kb-row';
  row4.appendChild(makeSpecialKey('SHIFT','ShiftLeft',1.8));
  keyRows[3].forEach(k => row4.appendChild(makeCharKey(k)));
  row4.appendChild(makeSpecialKey('SHIFT','ShiftRight',1.8));
  row4.appendChild(makeSpecialKey('MAR\nREL','MarRel',1.3));
  kb.appendChild(row4);
  // Row 5: Spacebar
  const row5 = document.createElement('div'); row5.className = 'kb-row';
  row5.appendChild(makeSpecialKey('','Space',10));
  kb.appendChild(row5);

  keyboardArea.innerHTML = '';
  keyboardArea.appendChild(kb);
}
function makeCharKey(keyDef) {
  const el = document.createElement('div');
  el.className = 'key char-key';
  el.innerHTML = '<span class="upper">'+escH(keyDef.upper)+'</span><span class="lower">'+escH(keyDef.lower)+'</span>';
  el.dataset.code = keyDef.code;
  keyElements[keyDef.code] = el;
  el.addEventListener('mousedown', (e) => {
    e.preventDefault(); el.classList.add('pressed');
    typeCharacter(isShifted() ? keyDef.upper : keyDef.lower);
  });
  el.addEventListener('mouseup', () => el.classList.remove('pressed'));
  el.addEventListener('mouseleave', () => el.classList.remove('pressed'));
  el.addEventListener('touchstart', (e) => {
    e.preventDefault(); el.classList.add('pressed');
    typeCharacter(isShifted() ? keyDef.upper : keyDef.lower);
  });
  el.addEventListener('touchend', (e) => { e.preventDefault(); el.classList.remove('pressed'); });
  el.addEventListener('touchcancel', () => el.classList.remove('pressed'));
  return el;
}

function makeSpecialKey(label, code, wMul) {
  const el = document.createElement('div');
  el.className = 'key special-key';
  el.style.flex = '0 0 '+(wMul*3)+'em';
  el.innerHTML = '<span class="label">'+label.replace('\n','<br>')+'</span>';
  el.dataset.code = code;
  keyElements[code] = el;
  function onPress(e) {
    e.preventDefault(); el.classList.add('pressed');
    if (code==='Backspace') doBackspace();
    else if (code==='Enter') doCarriageReturn();
    else if (code==='Space') doSpace();
    else if (code==='Tab') doTab();
    else if (code==='MarRel') doMarginRelease();
    else if (code==='ShiftLock') { shiftLocked=!shiftLocked; updateShiftLockVisual(); }
    else if (code==='ShiftLeft'||code==='ShiftRight') {
      shiftHeld=true;
      if(shiftLocked){shiftLocked=false;updateShiftLockVisual();}
    }
  }
  function onRelease(e) {
    if(e)e.preventDefault(); el.classList.remove('pressed');
    if(code==='ShiftLeft'||code==='ShiftRight') shiftHeld=false;
  }
  el.addEventListener('mousedown', onPress);
  el.addEventListener('mouseup', onRelease);
  el.addEventListener('mouseleave', onRelease);
  el.addEventListener('touchstart', onPress);
  el.addEventListener('touchend', onRelease);
  el.addEventListener('touchcancel', onRelease);
  return el;
}

function escH(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// === RULER RENDERING (pixel-perfect canvas) ===
function drawRuler(rulerCanvas) {
  // Ruler is exactly CANVAS_W + 6*CELL_W wide (3 extra each side)
  const totalW = CANVAS_W + 6 * CELL_W; // 2480 + 186 = 2666
  rulerCanvas.width = totalW;
  rulerCanvas.height = RULER_H;
  rulerCanvas.style.width = totalW + 'px';
  rulerCanvas.style.height = RULER_H + 'px';
  const rc = rulerCanvas.getContext('2d');
  rc.fillStyle = '#111';
  rc.fillRect(0, 0, totalW, RULER_H);
  // Draw marks for positions -3 to 82 (total 86 positions)
  for (let i = -3; i < 83; i++) {
    const x = (i + 3) * CELL_W; // pixel x for left edge of this position
    const cx = x + CELL_W / 2; // center
    const posInGroup = ((i % 10) + 10) % 10;
    const isMargin = (i === 10 || i === 70);
    const isOutside = (i < 0 || i >= 80);
    // Draw notch
    let notchH = 4; // small tick
    if (posInGroup === 0) notchH = 10; // major tick at 0,10,20...
    else if (posInGroup === 5) notchH = 7; // medium tick at 5,15,25...
    const color = isMargin ? '#f44' : (isOutside ? '#555' : '#aaa');
    rc.fillStyle = color;
    rc.fillRect(cx - 0.5, RULER_H - notchH, 1, notchH);
    // Draw digit labels at multiples of 10
    if (posInGroup === 0 && i >= 0 && i <= 80) {
      rc.fillStyle = isMargin ? '#f44' : '#ccc';
      rc.font = 'bold 9px monospace';
      rc.textAlign = 'center';
      rc.textBaseline = 'top';
      rc.fillText((i / 10).toString(), cx, 1);
    }
  }
}

// === LAYOUT / SCALING ===
function layout() {
  const appW = window.innerWidth;
  const appH = window.innerHeight;
  // Keyboard takes ~33% of height
  const kbH = Math.max(160, Math.floor(appH * 0.33));
  const nameplateH = 28;
  const canvasAreaH = appH - kbH - nameplateH;
  canvasArea.style.height = canvasAreaH + 'px';
  document.getElementById('keyboard-area').style.height = kbH + 'px';
  document.getElementById('nameplate').style.height = nameplateH + 'px';

  // Scale paper to fit width with some margin
  const availW = appW - 40; // 20px gray margin each side
  const scale = Math.min(availW / CANVAS_W, 1);
  const scaledPaperW = CANVAS_W * scale;
  const scaledPaperH = CANVAS_H * scale;
  const rulerW = (CANVAS_W + 6 * CELL_W) * scale;

  // Paper container sizing
  paperContainer.style.width = CANVAS_W + 'px';
  paperContainer.style.height = CANVAS_H + 'px';
  paperContainer.style.transform = 'scale(' + scale + ')';
  paperContainer.style.transformOrigin = 'top left';

  // Paper wrap (includes padding)
  paperWrap.style.width = scaledPaperW + 'px';
  paperWrap.style.height = (scaledPaperH + 2 * PAPER_PAD) + 'px';
  topPad.style.height = PAPER_PAD + 'px';
  bottomPad.style.height = PAPER_PAD + 'px';
  // Viewport takes remaining vertical space (minus rulers)
  const vpH = canvasAreaH - 2 * RULER_H;
  viewport.style.height = vpH + 'px';
  viewport.style.width = appW + 'px';

  // Rulers: draw at native size then scale
  drawRuler(rulerTopCanvas);
  drawRuler(rulerBottomCanvas);
  rulerTopCanvas.style.width = rulerW + 'px';
  rulerTopCanvas.style.height = RULER_H + 'px';
  rulerBottomCanvas.style.width = rulerW + 'px';
  rulerBottomCanvas.style.height = RULER_H + 'px';
  // Position rulers: center with paper, offset by 3 cells
  const rulerLeft = (appW - scaledPaperW) / 2 - 3 * CELL_W * scale;
  rulerTopCanvas.style.marginLeft = Math.max(0, rulerLeft) + 'px';
  rulerBottomCanvas.style.marginLeft = Math.max(0, rulerLeft) + 'px';

  // Center paper in viewport with gray on sides
  paperWrap.style.marginLeft = ((appW - scaledPaperW) / 2) + 'px';
  paperWrap.style.marginRight = 'auto';

  // Keyboard width matches paper width
  const kbEl = document.getElementById('keyboard-area');
  const kbInner = kbEl.querySelector('.keyboard');
  if (kbInner) {
    kbInner.style.maxWidth = Math.min(scaledPaperW, appW - 20) + 'px';
  }
}

// === INITIALIZATION ===
function init() {
  buildKeyboard();
  layout();
  updateCursor();
  window.addEventListener('resize', () => { layout(); updateCursor(); });
}
init();
})();
</script>
<style>
#canvas-area {
  flex: 1; overflow: hidden; display: flex; flex-direction: column;
  align-items: flex-start; background: #2a2a2a; position: relative;
}
#paper-viewport {
  overflow-y: auto; overflow-x: hidden; position: relative;
  scrollbar-width: thin; scrollbar-color: #555 #2a2a2a;
}
#paper-viewport::-webkit-scrollbar { width: 10px; }
#paper-viewport::-webkit-scrollbar-track { background: #2a2a2a; }
#paper-viewport::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
#paper-wrap {
  position: relative;
}
.paper-pad {
  background: #2a2a2a; width: 100%;
}
#paper-container {
  position: relative; background: #fff;
  box-shadow: 0 2px 20px rgba(0,0,0,0.5);
}
#typing-canvas { display: block; background: #fff; }
#cursor {
  position: absolute; width: 31px; height: 44px;
  background: rgba(0,0,0,0.8); pointer-events: none;
  animation: blink 1s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
#cursor.red { background: rgba(200,0,0,0.85); }
canvas[id^="ruler"] {
  display: block; flex-shrink: 0; image-rendering: pixelated;
}
/* Nameplate */
#nameplate {
  background: #3d3d3d; display: flex; align-items: center;
  justify-content: center; border-top: 1px solid #555;
  border-bottom: 1px solid #222; flex-shrink: 0;
}
#nameplate span {
  font-family: 'Georgia', serif; font-style: italic;
  font-size: 14px; color: #c0b090; letter-spacing: 3px;
  text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
  background: linear-gradient(to bottom, #4a4a4a, #2a2a2a);
  padding: 2px 18px; border-radius: 10px;
  border: 1px solid #555;
}
/* Keyboard Area */
#keyboard-area {
  background: #5ab4ac; display: flex; align-items: center;
  justify-content: center; padding: 6px; flex-shrink: 0;
  border-top: 3px solid #3d8c85;
}
.keyboard {
  display: flex; flex-direction: column; gap: 4px;
  align-items: center; width: 100%;
}
.kb-row {
  display: flex; gap: 3px; justify-content: center; width: 100%;
}
.key {
  height: 2.6em; min-width: 2.6em; border-radius: 50%;
  background: #f5f0e8; border: 2px solid #999;
