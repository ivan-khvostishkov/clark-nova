<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Clark Nova Typewriter by NoSocial.Net</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%233d3d3d'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-style='italic' font-weight='bold' fill='%23c0b090' text-anchor='middle'%3ECN%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='22' fill='%233d3d3d'/%3E%3Ctext x='90' y='120' font-family='Georgia,serif' font-size='100' font-style='italic' font-weight='bold' fill='%23c0b090' text-anchor='middle'%3ECN%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5ab4ac">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&family=EB+Garamond:ital,wght@1,500;1,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1a1a;
font-family:'Courier Prime','Courier New',monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#app{width:100%;height:100%;display:flex;flex-direction:column}
#canvas-area{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:stretch;background:#2a2a2a;position:relative}
#vp-row{flex:1;display:flex;align-items:stretch;overflow:hidden;position:relative}
#paper-viewport{flex:1;overflow:hidden;position:relative;cursor:grab}
#paper-viewport.dragging{cursor:grabbing}
#paper-inner{position:absolute;top:0;left:0;transform-origin:0 0}
#paper-container{position:relative;background:#fff;box-shadow:0 2px 20px rgba(0,0,0,0.5);
width:2480px;height:3508px}
#typing-canvas{display:block;width:2480px;height:3508px;image-rendering:auto}
#cursor{position:absolute;background:rgba(0,0,0,0.75);pointer-events:none;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#cursor.red{background:rgba(200,0,0,0.85)}
.ruler-wrap{height:28px;background:#111;flex-shrink:0;overflow:hidden;position:relative}
.ruler-canvas{display:block;position:absolute;top:0}
.roll-col{width:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;background:#222;flex-shrink:0}
.roll-btn{width:0;height:0;cursor:pointer;border:9px solid transparent;-webkit-tap-highlight-color:transparent}
.roll-up{border-bottom:12px solid #e8e4dc;border-top:none}
.roll-down{border-top:12px solid #e8e4dc;border-bottom:none}
.roll-btn:active,.roll-btn.pressed{filter:brightness(0.7)}
</style>
</head>
<body>
<div id="app">
<div id="canvas-area">
<div id="ruler-top" class="ruler-wrap"></div>
<div id="vp-row">
<div class="roll-col"><div class="roll-btn roll-up" data-dir="up"></div><div class="roll-btn roll-down" data-dir="down"></div></div>
<div id="paper-viewport"><div id="paper-inner"><div id="paper-container">
<canvas id="typing-canvas" width="2480" height="3508"></canvas>
<div id="cursor"></div>
</div></div></div>
<div class="roll-col"><div class="roll-btn roll-up" data-dir="up"></div><div class="roll-btn roll-down" data-dir="down"></div></div>
</div>
<div id="ruler-bottom" class="ruler-wrap"></div>
</div>
<div id="nameplate"><span class="np-plate"><span class="np-screw"></span><span class="np-text">Clark Nova</span><span class="np-screw"></span></span></div>
<div id="keyboard-area"></div>
</div>
<script>
(function(){
'use strict';
// === GRID ===
// 2480x3508. 80 cols. CELL_W=31. CELL_H=44. ROWS=79.
// 79*44=3476. Remainder=32. Pad: 16 top + 16 bottom. 16+3476+16=3508.
const CELL_W=31,CELL_H=44,COLS=80,ROWS=79;
const CANVAS_W=2480,CANVAS_H=3508;
const GRID_TOP=16; // padding before first row
const LEFT_MARGIN=11,RIGHT_MARGIN=70,HARD_RIGHT=80,BELL_COL=63;
const INITIAL_ROW=5,INITIAL_COL=11;
const RULER_H=28,ROLL_W=28;

let cursorCol=INITIAL_COL,cursorRow=INITIAL_ROW;
let shiftLocked=false,shiftHeld=false,marginReleased=false;
let audioCtx=null;
let fontsReady=false;

// View state
let viewScale=1; // current zoom scale of paper
let viewX=0,viewY=0; // pan offset (paper-inner left/top)
let baseScale=1; // scale that fits paper width in viewport

const canvas=document.getElementById('typing-canvas');
const ctx=canvas.getContext('2d');
const cursorEl=document.getElementById('cursor');
const viewport=document.getElementById('paper-viewport');
const paperInner=document.getElementById('paper-inner');

// === CANVAS INIT ===
ctx.fillStyle='#ffffff';ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
const wm=[[620,877],[1860,877],[620,2631],[1860,2631]];
ctx.font='bold 48px "Courier Prime",Courier,monospace';
ctx.fillStyle='rgba(254,254,254,1)';ctx.textAlign='center';ctx.textBaseline='middle';
wm.forEach(([x,y])=>{ctx.fillText('Clark Nova',x,y);ctx.fillText('by NoSocial.Net',x,y+56);});
ctx.textAlign='start';ctx.textBaseline='alphabetic';

// === AUDIO ===
function getAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
// Hammer strike (printable chars only)
function playKeystroke(){
  try{const ac=getAC(),t=ac.currentTime,sr=ac.sampleRate;
  const buf=ac.createBuffer(1,Math.floor(sr*0.035),sr);const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){const env=Math.exp(-i/(sr*0.006));
    d[i]=env*(Math.random()*2-1)*0.5+env*0.25*Math.sin(i*2*Math.PI*4500/sr);}
  const src=ac.createBufferSource();src.buffer=buf;src.connect(ac.destination);src.start(t);}catch(e){}
}
function playBell(){
  try{const ac=getAC(),t=ac.currentTime;
  const osc=ac.createOscillator(),g=ac.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(2400,t);
  g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.6);
  osc.connect(g);g.connect(ac.destination);osc.start(t);osc.stop(t+0.6);}catch(e){}
}
// CR: трещётка - деревяшка по стиральной доске, ускоряющееся трещание + удар
function playCR(){
  try{const ac=getAC(),t=ac.currentTime,sr=ac.sampleRate;
  const len=0.45;
  const buf=ac.createBuffer(1,Math.floor(sr*len),sr);const d=buf.getChannelData(0);
  // Ребристая доска: равномерные щелчки с ускорением (как палочка по рёбрам)
  // Каждый щелчок = короткий треск (белый шум 2-3ms)
  const totalClicks=22;
  for(let c=0;c<totalClicks;c++){
    // Квадратичное ускорение: щелчки всё ближе друг к другу
    const clickPos=(c/totalClicks);
    const clickTime=clickPos*clickPos*0.38;
    const clickSample=Math.floor(clickTime*sr);
    // Каждый щелчок: 2ms треск + деревянный резонанс
    const clickDur=Math.floor(sr*0.003);
    const volume=0.25+c/totalClicks*0.2; // громче к концу
    for(let j=0;j<clickDur&&clickSample+j<d.length;j++){
      const e=Math.exp(-j/(sr*0.0008));
      // Деревянный щелчок: шум + высокая синусоида
      d[clickSample+j]+=e*volume*((Math.random()*2-1)*0.7+Math.sin(j*2*Math.PI*2200/sr)*0.3);
    }
  }
  // Щелчок в конце - каретка встала в паз (короткий сухой клик)
  const boomStart=Math.floor(sr*0.39);
  const clickLen=Math.floor(sr*0.003);
  for(let i=boomStart;i<boomStart+clickLen&&i<d.length;i++){
    const bp=(i-boomStart)/clickLen;
    d[i]+=0.5*Math.exp(-bp*3)*(Math.random()*2-1);
  }
  const src=ac.createBufferSource();src.buffer=buf;
  src.connect(ac.destination);src.start(t);}catch(e){}
}
// Space/backspace/tab: short carriage slide
function playSlide(){
  try{const ac=getAC(),t=ac.currentTime,sr=ac.sampleRate;
  const buf=ac.createBuffer(1,Math.floor(sr*0.06),sr);const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){const env=Math.exp(-i/(sr*0.018));
    d[i]=env*((Math.random()*2-1)*0.1+0.07*Math.sin(i*2*Math.PI*110/sr));}
  const src=ac.createBufferSource();src.buffer=buf;
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=800;
  src.connect(f);f.connect(ac.destination);src.start(t);}catch(e){}
}
// Roll drum: short Hr-r-r
function playRoll(){
  try{const ac=getAC(),t=ac.currentTime,sr=ac.sampleRate;
  const buf=ac.createBuffer(1,Math.floor(sr*0.1),sr);const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){const p=i/d.length;
    const env=p<0.1?p*10:Math.exp(-(p-0.1)*5);
    d[i]=env*((Math.random()*2-1)*0.08+0.06*Math.sin(i*2*Math.PI*85/sr));}
  const src=ac.createBufferSource();src.buffer=buf;
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=500;
  src.connect(f);f.connect(ac.destination);src.start(t);}catch(e){}
}
// Shift/lock: soft click
function playClick(){
  try{const ac=getAC(),t=ac.currentTime,sr=ac.sampleRate;
  const buf=ac.createBuffer(1,Math.floor(sr*0.015),sr);const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){d[i]=Math.exp(-i/(sr*0.003))*(Math.random()*2-1)*0.15;}
  const src=ac.createBufferSource();src.buffer=buf;src.connect(ac.destination);src.start(t);}catch(e){}
}
// Margin release: click + hollow ding
function playMarRel(){
  try{const ac=getAC(),t=ac.currentTime;
  playClick();
  const osc=ac.createOscillator(),g=ac.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(1800,t+0.015);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.1,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  osc.connect(g);g.connect(ac.destination);osc.start(t+0.015);osc.stop(t+0.18);}catch(e){}
}
// === CHARACTER MAP ===
const keyRows=[
[{l:'1',u:'!',c:'Digit1'},{l:'2',u:'"',c:'Digit2'},{l:'3',u:'#',c:'Digit3'},
 {l:'4',u:'$',c:'Digit4'},{l:'5',u:'%',c:'Digit5'},{l:'6',u:'_',c:'Digit6'},
 {l:'7',u:'&',c:'Digit7'},{l:'8',u:"'",c:'Digit8'},{l:'9',u:'(',c:'Digit9'},
 {l:'0',u:')',c:'Digit0'},{l:'-',u:'*',c:'Minus'},{l:'=',u:'+',c:'Equal'}],
[{l:'q',u:'Q',c:'KeyQ'},{l:'w',u:'W',c:'KeyW'},{l:'e',u:'E',c:'KeyE'},
 {l:'r',u:'R',c:'KeyR'},{l:'t',u:'T',c:'KeyT'},{l:'y',u:'Y',c:'KeyY'},
 {l:'u',u:'U',c:'KeyU'},{l:'i',u:'I',c:'KeyI'},{l:'o',u:'O',c:'KeyO'},
 {l:'p',u:'P',c:'KeyP'},{l:'\u00BD',u:'\u00BC',c:'BracketLeft'}],
[{l:'a',u:'A',c:'KeyA'},{l:'s',u:'S',c:'KeyS'},{l:'d',u:'D',c:'KeyD'},
 {l:'f',u:'F',c:'KeyF'},{l:'g',u:'G',c:'KeyG'},{l:'h',u:'H',c:'KeyH'},
 {l:'j',u:'J',c:'KeyJ'},{l:'k',u:'K',c:'KeyK'},{l:'l',u:'L',c:'KeyL'},
 {l:';',u:':',c:'Semicolon'},{l:'\u00A2',u:'@',c:'Quote'}],
[{l:'z',u:'Z',c:'KeyZ'},{l:'x',u:'X',c:'KeyX'},{l:'c',u:'C',c:'KeyC'},
 {l:'v',u:'V',c:'KeyV'},{l:'b',u:'B',c:'KeyB'},{l:'n',u:'N',c:'KeyN'},
 {l:'m',u:'M',c:'KeyM'},{l:',',u:',',c:'Comma'},{l:'.',u:'.',c:'Period'},
 {l:'/',u:'?',c:'Slash'}]
];
const codeToKey={};keyRows.forEach(r=>r.forEach(k=>{codeToKey[k.c]=k;}));

// === CURSOR & VIEW ===
function cursorPxX(){return(cursorCol-1)*CELL_W;}
function cursorPxY(){return GRID_TOP+(cursorRow-1)*CELL_H;}

function updateCursor(){
  cursorEl.style.left=cursorPxX()+'px';
  cursorEl.style.top=cursorPxY()+'px';
  cursorEl.style.width=CELL_W+'px';
  cursorEl.style.height=CELL_H+'px';
  if((cursorCol>RIGHT_MARGIN&&!marginReleased)||(cursorCol>=HARD_RIGHT&&marginReleased)){
    cursorEl.classList.add('red');
  }else{cursorEl.classList.remove('red');}
  updateMarRelVis();
}

function panToCursor(){
  // Adjust viewX/viewY so cursor is visible in viewport
  const vpW=viewport.clientWidth,vpH=viewport.clientHeight;
  const cx=cursorPxX()*viewScale,cy=cursorPxY()*viewScale;
  const cw=CELL_W*viewScale,ch=CELL_H*viewScale;
  // Current visible region: -viewX to -viewX+vpW, -viewY to -viewY+vpH
  if(cx+viewX<0)viewX=-cx+10;
  if(cx+cw+viewX>vpW)viewX=vpW-cx-cw-10;
  if(cy+viewY<0)viewY=-cy+10;
  if(cy+ch+viewY>vpH)viewY=vpH-cy-ch-10;
  applyView();
}

function applyView(){
  paperInner.style.transform='translate('+viewX+'px,'+viewY+'px) scale('+viewScale+')';
  drawRulers();
}

function updateMarRelVis(){
  const el=keyElements['MarRel'];if(!el)return;
  if(cursorCol>RIGHT_MARGIN&&!marginReleased)el.classList.add('mar-active');
  else el.classList.remove('mar-active');
}
function checkBell(o,n){if(o<BELL_COL&&n>=BELL_COL)playBell();}
// === TYPING LOGIC ===
function isShifted(){return shiftLocked||shiftHeld;}
function canType(){
  if(cursorCol>HARD_RIGHT)return false;
  if(cursorCol>RIGHT_MARGIN&&!marginReleased)return false;
  return true;
}
function typeCharacter(ch){
  if(!fontsReady||!canType())return;
  const x=(cursorCol-1)*CELL_W;
  const y=GRID_TOP+(cursorRow-1)*CELL_H;
  // Ink-on-paper effect: shadow for bleed, then crisp text
  ctx.save();
  ctx.shadowColor='rgba(10,10,30,0.3)';
  ctx.shadowBlur=1.2;
  ctx.shadowOffsetX=0.4;ctx.shadowOffsetY=0.4;
  ctx.font='28px "Special Elite","Courier Prime",monospace';
  ctx.fillStyle='#0a0a1e';ctx.textBaseline='top';
  ctx.fillText(ch,x+3,y+9);
  ctx.restore();
  ctx.font='28px "Special Elite","Courier Prime",monospace';
  ctx.fillStyle='#0a0a1e';ctx.textBaseline='top';
  ctx.fillText(ch,x+3,y+9);
  playKeystroke();
  if(cursorCol>=HARD_RIGHT){updateCursor();return;}
  const oc=cursorCol;cursorCol++;
  if(cursorCol>RIGHT_MARGIN&&!marginReleased)cursorCol=RIGHT_MARGIN+1;
  checkBell(oc,cursorCol);updateCursor();panToCursor();
}
function doSpace(){
  if(!canType())return;playSlide();
  if(cursorCol>=HARD_RIGHT){updateCursor();return;}
  const oc=cursorCol;cursorCol++;
  if(cursorCol>RIGHT_MARGIN&&!marginReleased)cursorCol=RIGHT_MARGIN+1;
  checkBell(oc,cursorCol);updateCursor();panToCursor();
}
function doTab(){
  if(!canType())return;playSlide();
  if(cursorCol>=HARD_RIGHT){updateCursor();return;}
  const oc=cursorCol;
  let t=Math.floor((cursorCol-1)/5)*5+6;
  if(t<=cursorCol)t+=5;
  if(t>HARD_RIGHT)t=HARD_RIGHT;
  if(t>RIGHT_MARGIN&&!marginReleased)t=RIGHT_MARGIN+1;
  cursorCol=t;checkBell(oc,cursorCol);updateCursor();panToCursor();
}
function doBackspace(){if(cursorCol>1){cursorCol--;playSlide();updateCursor();panToCursor();}}
function doCR(){
  if(cursorRow>=ROWS)return;
  cursorRow++;cursorCol=INITIAL_COL;marginReleased=false;
  playCR();updateCursor();panToCursor();
}
function doMarRel(){
  if(cursorCol>RIGHT_MARGIN&&!marginReleased){marginReleased=true;playMarRel();updateCursor();}
}
function doUp(){if(cursorRow>1){cursorRow--;playRoll();updateCursor();panToCursor();}}
function doDown(){if(cursorRow<ROWS){cursorRow++;playRoll();updateCursor();panToCursor();}}

// === KEYBOARD INPUT ===
function handleKeyDown(e){
  if(e.repeat)return;const c=e.code;
  if(c==='ShiftLeft'||c==='ShiftRight'){shiftHeld=true;playClick();if(shiftLocked){shiftLocked=false;uSL();}hlK(c,1);e.preventDefault();return;}
  if(c==='Enter'){doCR();hlK('Enter',1);e.preventDefault();return;}
  if(c==='Backspace'){doBackspace();hlK('Backspace',1);e.preventDefault();return;}
  if(c==='Tab'){doTab();hlK('Tab',1);e.preventDefault();return;}
  if(c==='Space'){doSpace();hlK('Space',1);e.preventDefault();return;}
  if(c==='ControlRight'){doMarRel();hlK('MarRel',1);e.preventDefault();return;}
  if(c==='ArrowUp'){doUp();hlK('ArrowUp',1);e.preventDefault();return;}
  if(c==='ArrowDown'){doDown();hlK('ArrowDown',1);e.preventDefault();return;}
  const kd=codeToKey[c];
  if(kd){typeCharacter(isShifted()?kd.u:kd.l);hlK(c,1);e.preventDefault();}
}
function handleKeyUp(e){const c=e.code;
  if(c==='ShiftLeft'||c==='ShiftRight'){shiftHeld=false;hlK(c,0);return;}hlK(c,0);}
document.addEventListener('keydown',handleKeyDown);
document.addEventListener('keyup',handleKeyUp);
// === SCHEMATIC KEYBOARD ===
const keyboardArea=document.getElementById('keyboard-area');
const keyElements={};
function hlK(c,on){
  const el=keyElements[c];if(el){if(on)el.classList.add('pressed');else el.classList.remove('pressed');}
  // Sync both shifts visually
  if(c==='ShiftLeft'||c==='ShiftRight'){
    const other=c==='ShiftLeft'?keyElements['ShiftRight']:keyElements['ShiftLeft'];
    if(other){if(on)other.classList.add('pressed');else other.classList.remove('pressed');}
  }
  // Sync both roll button pairs
  if(c==='ArrowUp'){document.querySelectorAll('.roll-up').forEach(e=>{if(on)e.classList.add('pressed');else e.classList.remove('pressed');});}
  if(c==='ArrowDown'){document.querySelectorAll('.roll-down').forEach(e=>{if(on)e.classList.add('pressed');else e.classList.remove('pressed');});}
}
function uSL(){const el=keyElements['ShiftLock'];if(el){if(shiftLocked)el.classList.add('locked');else el.classList.remove('locked');}}
function buildKB(){
  const kb=document.createElement('div');kb.className='keyboard';
  const r1=mkR();r1.appendChild(mkS('BS','Backspace',1.4));
  keyRows[0].forEach(k=>r1.appendChild(mkC(k)));r1.appendChild(mkS('TAB','Tab',1.4));kb.appendChild(r1);
  const r2=mkR();keyRows[1].forEach(k=>r2.appendChild(mkC(k)));kb.appendChild(r2);
  const r3=mkR();r3.appendChild(mkS('LOCK','ShiftLock',1.6));
  keyRows[2].forEach(k=>r3.appendChild(mkC(k)));r3.appendChild(mkS('\u21B5','Enter',1.6));kb.appendChild(r3);
  const r4=mkR();r4.appendChild(mkS('\u21E7','ShiftLeft',1.6));
  keyRows[3].forEach(k=>r4.appendChild(mkC(k)));
  r4.appendChild(mkS('\u21E7','ShiftRight',1.6));r4.appendChild(mkS('MR','MarRel',1.1));kb.appendChild(r4);
  const r5=mkR();const spKey=mkS('','Space',8);spKey.style.flex='1 1 45%';spKey.style.maxWidth='45%';spKey.style.borderRadius='6px';spKey.style.aspectRatio='auto';spKey.style.height='28px';kb.appendChild(r5);r5.appendChild(spKey);
  keyboardArea.innerHTML='';keyboardArea.appendChild(kb);
}
function mkR(){const d=document.createElement('div');d.className='kb-row';return d;}
function mkC(kd){
  const el=document.createElement('div');el.className='key ck';
  el.setAttribute('data-u',kd.u);el.setAttribute('data-l',kd.l);
  // Letter keys (a-z): show only uppercase, bigger
  const isLetter=(kd.l.length===1&&kd.l>='a'&&kd.l<='z');
  if(isLetter){
    el.innerHTML='<span class="kl kl-only">'+esc(kd.u)+'</span>';
  } else {
    // Symbol/number keys: show both, upper closer to lower
    el.innerHTML='<span class="ku">'+esc(kd.u)+'</span><span class="kl">'+esc(kd.l)+'</span>';
  }
  keyElements[kd.c]=el;
  const act=()=>typeCharacter(isShifted()?kd.u:kd.l);
  el.addEventListener('mousedown',e=>{e.preventDefault();el.classList.add('pressed');act();});
  el.addEventListener('mouseup',()=>el.classList.remove('pressed'));
  el.addEventListener('mouseleave',()=>el.classList.remove('pressed'));
  el.addEventListener('touchstart',e=>{e.preventDefault();el.classList.add('pressed');act();},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();el.classList.remove('pressed');},{passive:false});
  el.addEventListener('touchcancel',()=>el.classList.remove('pressed'));
  return el;
}
function mkS(label,code,wM){
  const el=document.createElement('div');el.className='key sk';
  el.style.flex='0 0 '+(wM*100/14)+'%';
  el.innerHTML='<span class="label">'+label+'</span>';
  keyElements[code]=el;
  function pr(e){e.preventDefault();el.classList.add('pressed');
    if(code==='Backspace')doBackspace();else if(code==='Enter')doCR();
    else if(code==='Space')doSpace();else if(code==='Tab')doTab();
    else if(code==='MarRel')doMarRel();
    else if(code==='ShiftLock'){shiftLocked=true;uSL();playClick();}
    else if(code==='ShiftLeft'||code==='ShiftRight'){shiftHeld=true;playClick();hlK(code,1);if(shiftLocked){shiftLocked=false;uSL();}}
  }
  function rl(e){if(e)e.preventDefault();el.classList.remove('pressed');
    if(code==='ShiftLeft'||code==='ShiftRight'){shiftHeld=false;hlK(code,0);}}
  el.addEventListener('mousedown',pr);el.addEventListener('mouseup',rl);el.addEventListener('mouseleave',rl);
  el.addEventListener('touchstart',pr,{passive:false});el.addEventListener('touchend',rl,{passive:false});el.addEventListener('touchcancel',rl);
  return el;
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// Roll buttons (both sides, synced visually)
document.querySelectorAll('.roll-up').forEach(el=>{
  el.addEventListener('mousedown',e=>{e.preventDefault();doUp();
    document.querySelectorAll('.roll-up').forEach(b=>b.classList.add('pressed'));});
  el.addEventListener('mouseup',()=>document.querySelectorAll('.roll-up').forEach(b=>b.classList.remove('pressed')));
  el.addEventListener('mouseleave',()=>document.querySelectorAll('.roll-up').forEach(b=>b.classList.remove('pressed')));
  el.addEventListener('touchstart',e=>{e.preventDefault();doUp();
    document.querySelectorAll('.roll-up').forEach(b=>b.classList.add('pressed'));},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();document.querySelectorAll('.roll-up').forEach(b=>b.classList.remove('pressed'));},{passive:false});
});
document.querySelectorAll('.roll-down').forEach(el=>{
  el.addEventListener('mousedown',e=>{e.preventDefault();doDown();
    document.querySelectorAll('.roll-down').forEach(b=>b.classList.add('pressed'));});
  el.addEventListener('mouseup',()=>document.querySelectorAll('.roll-down').forEach(b=>b.classList.remove('pressed')));
  el.addEventListener('mouseleave',()=>document.querySelectorAll('.roll-down').forEach(b=>b.classList.remove('pressed')));
  el.addEventListener('touchstart',e=>{e.preventDefault();doDown();
    document.querySelectorAll('.roll-down').forEach(b=>b.classList.add('pressed'));},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();document.querySelectorAll('.roll-down').forEach(b=>b.classList.remove('pressed'));},{passive:false});
});
keyElements['ArrowUp']=document.querySelector('.roll-up');
keyElements['ArrowDown']=document.querySelector('.roll-down');
// === RULERS (drawn at display resolution) ===
function drawRulers(){
  drawRuler(document.getElementById('ruler-top'));
  drawRuler(document.getElementById('ruler-bottom'));
}
function drawRuler(container){
  container.innerHTML='';
  const cellPx=CELL_W*viewScale;
  const extra=4;
  const totalCells=COLS+2*extra;
  const totalW=Math.ceil(totalCells*cellPx);
  const h=RULER_H;
  const dpr=window.devicePixelRatio||1;
  const cvs=document.createElement('canvas');
  cvs.width=Math.ceil(totalW*dpr);cvs.height=Math.ceil(h*dpr);
  cvs.style.width=totalW+'px';cvs.style.height=h+'px';
  cvs.className='ruler-canvas';
  const rc=cvs.getContext('2d');rc.scale(dpr,dpr);
  rc.fillStyle='#111';rc.fillRect(0,0,totalW,h);
  for(let i=-extra;i<=COLS+extra;i++){
    const cx=(i+extra)*cellPx;
    const grp=((i%10)+10)%10;
    const isMarg=(i===10||i===70);
    const isOut=(i<0||i>COLS);
    let nh=Math.max(3,h*0.16);
    if(grp===0)nh=Math.max(8,h*0.45);
    else if(grp===5)nh=Math.max(5,h*0.3);
    const nw=Math.max(1.5,cellPx*0.06);
    rc.fillStyle=isMarg?'#f44':(isOut?'#444':'#888');
    rc.fillRect(cx-nw/2,h-nh,nw,nh);
    if(grp===0&&i>=0&&i<=COLS){
      const lbl=i.toString();
      const fs=Math.max(7,Math.min(cellPx*0.38,14));
      rc.font='bold '+fs+'px sans-serif';
      rc.fillStyle=isMarg?'#f44':'#ddd';
      if(lbl.length===1){
        rc.textAlign='center';rc.textBaseline='bottom';
        rc.fillText(lbl,cx,h-nh+fs*0.85);
      }else{
        rc.textAlign='right';rc.textBaseline='bottom';
        rc.fillText(lbl[0],cx-nw/2-1,h-nh+fs*0.85);
        rc.textAlign='left';
        rc.fillText(lbl[1],cx+nw/2+1,h-nh+fs*0.85);
      }
    }
  }
  // Position: ruler notch 0 must align with paper left edge on screen.
  // Paper is inside viewport, which is between two roll columns (28px each).
  // Paper left on screen = 28 (left roll col) + viewX
  const paperScreenLeft=28+viewX;
  const rulerOffset=paperScreenLeft-extra*cellPx;
  cvs.style.left=Math.round(rulerOffset)+'px';
  container.appendChild(cvs);
}
// === ZOOM & PAN ===
// Mouse wheel zoom (only on paper area)
viewport.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=viewport.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const factor=e.deltaY<0?1.1:0.9;
  zoomAt(mx,my,factor);
},{passive:false});

// Pinch zoom (touch)
let pinchDist=0,pinchScale=1;
let touches=[];
viewport.addEventListener('touchstart',e=>{
  touches=Array.from(e.touches);
  if(touches.length===2){
    pinchDist=Math.hypot(touches[1].clientX-touches[0].clientX,touches[1].clientY-touches[0].clientY);
    pinchScale=viewScale;
  }
},{passive:false});
viewport.addEventListener('touchmove',e=>{
  e.preventDefault();
  const ts=Array.from(e.touches);
  if(ts.length===2){
    const d=Math.hypot(ts[1].clientX-ts[0].clientX,ts[1].clientY-ts[0].clientY);
    const rect=viewport.getBoundingClientRect();
    const cx=(ts[0].clientX+ts[1].clientX)/2-rect.left;
    const cy=(ts[0].clientY+ts[1].clientY)/2-rect.top;
    const newScale=pinchScale*(d/pinchDist);
    const factor=newScale/viewScale;
    zoomAt(cx,cy,factor);
  }else if(ts.length===1&&touches.length===1){
    // Pan
    const dx=ts[0].clientX-touches[0].clientX;
    const dy=ts[0].clientY-touches[0].clientY;
    viewX+=dx;viewY+=dy;
    clampView();applyView();
  }
  touches=ts;
},{passive:false});

// Mouse drag pan
let dragging=false,dragX=0,dragY=0;
viewport.addEventListener('mousedown',e=>{
  if(e.button===0){dragging=true;dragX=e.clientX;dragY=e.clientY;viewport.classList.add('dragging');}
});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  viewX+=e.clientX-dragX;viewY+=e.clientY-dragY;
  dragX=e.clientX;dragY=e.clientY;
  clampView();applyView();
});
window.addEventListener('mouseup',()=>{dragging=false;viewport.classList.remove('dragging');});

function zoomAt(px,py,factor){
  const newScale=Math.max(baseScale*0.5,Math.min(baseScale*4,viewScale*factor));
  // Zoom centered on (px,py) in viewport
  viewX=px-(px-viewX)*(newScale/viewScale);
  viewY=py-(py-viewY)*(newScale/viewScale);
  viewScale=newScale;
  // After zoom, center horizontally if paper fits in viewport
  const vpW=viewport.clientWidth;
  const pw=CANVAS_W*viewScale;
  if(pw<=vpW){
    viewX=Math.round((vpW-pw)/2);
  }
  clampView();applyView();
}

function clampView(){
  const vpW=viewport.clientWidth,vpH=viewport.clientHeight;
  const pw=CANVAS_W*viewScale,ph=CANVAS_H*viewScale;
  // Allow dragging paper anywhere as long as some part is visible
  // But default center when zoomed out
  const maxX=vpW-20; // can push paper almost fully off to right
  const minX=-(pw-20); // can push paper almost fully off to left
  if(viewX>maxX)viewX=maxX;
  if(viewX<minX)viewX=minX;
  // Vertical: keep some paper visible
  if(viewY>50)viewY=50;
  if(viewY<vpH-ph-50)viewY=vpH-ph-50;
}
// === LAYOUT ===
function layout(){
  const appW=window.innerWidth,appH=window.innerHeight;
  const kbH=Math.max(140,Math.min(220,Math.floor(appH*0.28)));
  const npH=48;
  const caH=appH-kbH-npH;
  document.getElementById('canvas-area').style.height=caH+'px';
  document.getElementById('keyboard-area').style.height=kbH+'px';
  document.getElementById('nameplate').style.height=npH+'px';

  const vpW=viewport.clientWidth;
  const vpH2=caH-2*RULER_H;
  viewport.style.height=vpH2+'px';

  // Base scale: fit paper width in viewport
  baseScale=Math.min((vpW-20)/CANVAS_W,1);
  
  // On small screens, default zoom so ~24 columns (col 8-42) fill the width
  // This makes typed text readable. User can still zoom out to see full page.
  const smallScreen=(vpW<800);
  if(smallScreen){
    // Show about 24 columns worth = 24*31 = 744px of paper in vpW
    const initialScale=Math.min((vpW-10)/(24*CELL_W),baseScale*3);
    if(viewScale<=baseScale)viewScale=initialScale;
  } else {
    if(viewScale<baseScale*0.5)viewScale=baseScale;
    if(viewScale===1||viewScale<baseScale)viewScale=baseScale;
  }

  // Position paper: center on initial cursor area
  const pw=CANVAS_W*viewScale;
  if(smallScreen){
    // Center on cursor column area (col 8-42 roughly)
    const cursorScreenX=(INITIAL_COL-1)*CELL_W*viewScale;
    viewX=Math.round(vpW/2-cursorScreenX-CELL_W*viewScale*6);
    const cursorScreenY=(GRID_TOP+(INITIAL_ROW-1)*CELL_H)*viewScale;
    viewY=Math.round(vpH2*0.15-cursorScreenY);
  } else {
    viewX=Math.round((vpW-pw)/2);
    viewY=10;
  }
  clampView();
  applyView();
}

function init(){buildKB();layout();updateCursor();
  window.addEventListener('resize',()=>{layout();updateCursor();});
  // Enable iOS long-press save: overlay an <img> that updates on long-press
  let longPressTimer=null;
  const pc=document.getElementById('paper-container');
  pc.addEventListener('touchstart',function(e){
    if(e.touches.length===1){
      longPressTimer=setTimeout(()=>{
        // Create temporary img overlay for iOS save dialog
        const dataUrl=canvas.toDataURL('image/png');
        let img=document.getElementById('save-img');
        if(!img){img=document.createElement('img');img.id='save-img';
          img.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;';
          pc.appendChild(img);}
        img.src=dataUrl;
        // Remove after 3 seconds (user has time to long-press the img)
        setTimeout(()=>{if(img.parentNode)img.parentNode.removeChild(img);},3000);
      },600);
    }
  },{passive:true});
  pc.addEventListener('touchend',()=>{clearTimeout(longPressTimer);},{passive:true});
  pc.addEventListener('touchmove',()=>{clearTimeout(longPressTimer);},{passive:true});
}
// Wait for Special Elite font to fully load before enabling typing
document.fonts.load('28px "Special Elite"').then(()=>{fontsReady=true;init();}).catch(()=>{fontsReady=true;init();});
})();
// Register service worker
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
