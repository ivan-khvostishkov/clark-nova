name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_DIR: clarknova.nosocial.net

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@v5

      # v5 action releases run on the runner's Node 24; the v4 line still
      # declared the deprecated Node 20 runtime and warned on every build.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # The repo deliberately has no committed package.json: the site has zero
      # runtime dependencies and nothing should ever try to "build" it. The
      # parsers below are CI-only tools, installed into a throwaway manifest.
      - name: Install parsers
        run: |
          set -euo pipefail
          [ -f package.json ] || npm init -y > /dev/null
          npm install --no-save --no-audit --no-fund parse5@^7 acorn@^8 css-tree@^2

      - name: Static checks (HTML, CSS, JS, JSON, references)
        run: node tools/validate.mjs "$SITE_DIR"

      # Second opinion from V8 itself on every piece of JS that ships,
      # including the inline <script> blocks extracted by the step above.
      - name: Byte-compile all JavaScript
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$SITE_DIR"/*.js .ci/extracted/*.js)
          if [ ${#files[@]} -eq 0 ]; then echo "no JavaScript found to check"; exit 1; fi
          for f in "${files[@]}"; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Verify no leftover debug code
        run: |
          set -euo pipefail
          if grep -rn --include='*.js' --include='*.html' -E '\b(debugger|console\.(log|debug))\s*\(' "$SITE_DIR"; then
            echo "::error::debugger/console statements must not ship"
            exit 1
          fi
          echo "clean"

      - name: Assemble Amplify deploy tree
        id: pkg
        run: |
          set -euo pipefail
          # Version comes from the service worker cache name, so the artifact
          # name always matches what clients will see after the deploy.
          version=$(sed -n "s/.*CACHE_NAME[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" "$SITE_DIR/sw.js" | head -1)
          version=${version:-unversioned}

          rm -rf dist
          mkdir dist
          # Contents of the site dir, not the dir itself: Amplify needs
          # index.html at the archive root, with no wrapping folder. The
          # archive itself is produced by actions/upload-artifact, so the
          # download is a single zip, not a zip inside a zip.
          cp -R "$SITE_DIR"/. dist/
          rm -rf dist/audio_unused
          find dist -name '.DS_Store' -delete
          find dist -name 'Thumbs.db' -delete
          # Dotfiles would be silently dropped by upload-artifact, so refuse
          # to ship a tree that contains any.
          if [ -n "$(find dist -name '.*' -print -quit)" ]; then
            echo "::error::dist contains dot-prefixed entries that would not be uploaded"
            find dist -name '.*'
            exit 1
          fi

          {
            echo "artifact_name=${version}-${GITHUB_SHA::7}"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify deploy tree layout
        run: |
          set -euo pipefail
          ( cd dist && find . | LC_ALL=C sort )

          # index.html must sit at the root, not inside a folder.
          [ -f dist/index.html ] \
            || { echo "::error::index.html is not at the root of dist/"; exit 1; }
          if [ -n "$(find dist -mindepth 2 -name index.html -print -quit)" ]; then
            echo "::error::index.html is nested inside a subdirectory"; exit 1
          fi

          # Nothing dropped: every shipped file from the site dir is present.
          diff <(cd "$SITE_DIR" && find . -type f -not -path './audio_unused/*' \
                   -not -name '.DS_Store' -not -name 'Thumbs.db' \
                   | sed 's|^\./||' | LC_ALL=C sort) \
               <(cd dist && find . -type f | sed 's|^\./||' | LC_ALL=C sort) \
            || { echo "::error::dist/ contents differ from $SITE_DIR"; exit 1; }

          echo "deploy tree layout OK"

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### Amplify deploy archive"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Artifact | \`${{ steps.pkg.outputs.artifact_name }}\` |"
            echo "| Version | \`${{ steps.pkg.outputs.version }}\` |"
            echo "| Size | $(du -sh dist | cut -f1) |"
            echo "| Files | $(find dist -type f | wc -l) |"
            echo
            echo "Download the artifact: GitHub serves it as a single zip with"
            echo "\`index.html\` at the root, which is exactly what the Amplify"
            echo "console wants for a manual deploy — upload it as downloaded."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish archive
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.pkg.outputs.artifact_name }}
          path: dist
          if-no-files-found: error
          retention-days: 90
